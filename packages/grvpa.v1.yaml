esp32:
  board: esp32dev
  framework:
    type: esp-idf


i2c:
  id: i2c_bus1
  sda: ${tof_sda_pin}
  scl: ${tof_scl_pin}
  scan: true

# State used by the idle (no-movement) LED shutoff
globals:
  - id: ref_distance        # Distance at the last detected movement (<0 = not yet set)
    type: float
    initial_value: '-1.0'
  - id: last_motion_ms      # millis() at the last detected movement
    type: uint32_t
    initial_value: '0'
  - id: change_count        # Consecutive out-of-band readings (noise debounce)
    type: int
    initial_value: '0'
  - id: leds_idle           # true while the LEDs are blanked due to inactivity
    type: bool
    initial_value: 'false'

output:
  - platform: ledc
    id: pwm_red_output
    pin: ${red_led_pin}
    frequency: 500 Hz
    inverted: false
    max_power: 0.40 # Current limits do not increase
  - platform: ledc
    id: pwm_green_output
    pin: ${green_led_pin}
    frequency: 500 Hz
    inverted: false
    max_power: 0.40 # Current limits do not increase

number:
  - platform: template
    name: "Stop Distance Threshold"
    id: stop_distance_threshold
    min_value: 0.1
    max_value: 2.0
    step: 0.05
    restore_value: true
    initial_value: 0.8
    unit_of_measurement: "m"
    optimistic: true
  - platform: template
    name: "LED Idle Timeout"
    id: led_idle_timeout
    mode: box
    min_value: 5
    max_value: 3600
    step: 5
    restore_value: true
    initial_value: 60
    unit_of_measurement: "s"
    optimistic: true
  - platform: template
    name: "Minimum Distance Change"
    id: min_distance_change
    min_value: 0.01
    max_value: 1.0
    step: 0.01
    restore_value: true
    initial_value: 0.10
    unit_of_measurement: "m"
    optimistic: true

binary_sensor:
  - platform: template
    name: "LEDs Idle"
    entity_category: "diagnostic"
    lambda: |-
      return id(leds_idle);

light:
  - platform: monochromatic
    name: "Stop Light"
    output: pwm_red_output
    restore_mode: ALWAYS_OFF
  - platform: monochromatic
    name: "Go Light"
    output: pwm_green_output
    restore_mode: ALWAYS_ON

text_sensor:
  - platform: version
    name: ESPHome Version
    hide_timestamp: true
  - platform: wifi_info
    ip_address:
      name: "IP Address"

sensor:
  - platform: vl53l0x
    id: tof1
    internal: true        # Keep data local
    address: 0x29
    timing_budget: 200ms
    update_interval: 250ms
    long_range: true

# Note: Sunlight and bright light will cause read noise, filters  assist to clean this up.
# Some surfaces are difficult to read, glass and dark objects generate more random values slowing the transition actions.

    filters:
      - quantile:
          window_size: 4
          send_every: 1
          quantile: .9

    on_value:
      then:
        - lambda: |-
            static float last_good = -1;
            float dist = id(tof1).state;
            float stop_thresh = id(stop_distance_threshold).state;

            // ---- Idle detection: blank the LEDs when nothing has moved for a while ----
            float min_change = id(min_distance_change).state;                      // m
            uint32_t timeout_ms = (uint32_t) (id(led_idle_timeout).state * 1000.0f);
            uint32_t now = millis();

            // No reading (NaN) is treated as "max range" (the ~2 m long-range limit)
            // so a vehicle arriving or leaving still counts as movement.
            float eff = std::isnan(dist) ? 2.0f : dist;

            if (id(ref_distance) < 0) {
              // First reading after boot: start the idle timer
              id(ref_distance) = eff;
              id(last_motion_ms) = now;
              id(change_count) = 0;
            } else if (fabsf(eff - id(ref_distance)) > min_change) {
              // Must be out of band for 3 readings in a row to count as movement,
              // so a single noisy reading can't wake the LEDs
              if (++id(change_count) >= 3) {
                id(ref_distance) = eff;
                id(last_motion_ms) = now;
                id(change_count) = 0;
              }
            } else {
              id(change_count) = 0;
            }

            id(leds_idle) = (now - id(last_motion_ms)) >= timeout_ms;
            if (id(leds_idle)) {
              id(pwm_red_output).set_level(0.0);
              id(pwm_green_output).set_level(0.0);
              return;
            }

            // Reject invalid readings
            if (dist <= .12|| (dist > stop_thresh + 0.15) ) {
              id(pwm_red_output).set_level(0.0);
              id(pwm_green_output).set_level(0.55);
              return;
            }

            // LED logic
            if (dist <= stop_thresh) {
              id(pwm_red_output).set_level(0.55);
              id(pwm_green_output).set_level(0.0);
            } else {
              id(pwm_red_output).set_level(0.0);
              id(pwm_green_output).set_level(0.55);
            }

  - platform: template
    name: Vehicle Distance
    id: tof1_ha
    unit_of_measurement: "M"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      return id(tof1).state;   // read internal sensor

status_led:
  pin: ${status_led_pin}
